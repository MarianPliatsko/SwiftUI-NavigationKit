name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme IOSNavigationKit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
